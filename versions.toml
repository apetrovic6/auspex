# Single source of truth for versions that must agree across Cargo, Nix, Gradle and just.
#
# Several of these are load-bearing in more than one file, and a partial bump fails in
# ways that do not name the real cause:
#
#   boltffi  — the CLI (Nix), the crate (Cargo) and the doctor check (just) must match, or
#              generated bindings silently disagree with the runtime.
#   facet    — pinned exactly; facet_generate depends on `facet =<this>`, so a partial bump
#              puts two facet_core versions in one graph and fails with
#              "Facet<'_> is not satisfied" rather than as a version conflict.
#   android  — the NDK clang wrapper filename embeds the API level, so this must match
#              `minSdk` in every apps/*/platforms/android/app/build.gradle.kts.
#
# Nix reads this file directly (builtins.fromTOML). just reads it in the recipes that need
# it. Cargo cannot read it at all, so `cargo xtask check-versions` asserts that the
# manifests agree — run in CI.

[tools]
# BoltFFI CLI + crate. Must match devenv.nix's boltffi-cli derivation and
# [workspace.dependencies].boltffi in Cargo.toml.
boltffi = "0.30.1"

# Minimum Binaryen release providing --enable-bulk-memory-opt.
binaryen = "123"

# icu4x-datagen, which writes `crates/i18n-data/src/data` (ADR 0021). Nix reads this for the
# tool's derivation; `cargo xtask check-versions` asserts its major and minor against every
# `icu_*` dependency declared in the workspace.
#
# The two have to agree because the generated bytes are read by those crates, not by the
# tool: datagen serialises `databake` structures whose layouts belong to a specific ICU4X
# release, so a slice written by a different major than the runtime crates read is a payload
# that fails to load. Minor matters too — ICU4X adds markers in minor releases, and a marker
# the runtime knows but the tool never emitted is a compile error only if someone noticed
# enough to ask for it.
icu4x-datagen = "2.3.0"

# The entity tool, which writes `src/entities/*.rs`. It must agree with the `sea-orm` crate
# that reads them: sea-orm-cli emits `DeriveEntityModel` and the `#[sea_orm(...)]` attributes
# the runtime's derive macros understand, and a CLI a major ahead writes an entity the crate
# cannot compile. It is a crates.io binary rather than a Cargo dependency, so nothing in
# `Cargo.lock` connects it to the runtime — the `sea-orm-cli 1.1.20` that `Cargo.lock` names
# is `sea-orm-migration`'s library dependency, not the binary the recipe runs.
# `cargo xtask check-versions` asserts its major.minor against `sea-orm` and
# `sea-orm-migration`, and `nix/sea-orm-cli.nix` builds exactly this release.
#
# Raising it means re-running `just services/<svc>/entities` against a real schema and
# diffing the result against `tools/xtask/fixtures/entities/`, whose shape is what
# `check-template` feeds the generators offline. No gate runs sea-orm-cli, so that
# diff is the instruction the bump cannot skip.
#
# 1.1.20 rather than the 2.x line: moving the crate to sea-orm 2 is a migration of every
# service's entities and queries, which is a separate ticket. The CLI was pinned back to the
# runtime it writes for instead.
sea-orm-cli = "1.1.20"

# The CLDR release that slice is cut from, passed to datagen as `--cldr-tag`. It is pinned
# for the reason `just proto::check` pins its plugins: the default is `latest`, `latest`
# floats, and a floating input makes `just i18n::check-data` fail or pass depending on
# Unicode's release schedule rather than on whether anything in this repository changed.
# `just i18n::generate-data` and `just i18n::check-data` both read this one value, so the
# payload and its check cannot disagree about which CLDR they mean.
# No xtask assertion covers it: datagen takes it as an argument and nothing else in the
# repository has a spelling of a CLDR version to compare against — the same status Jaeger
# has above.
cldr-json = "48.2.1"

[crates]
# Must match [workspace.dependencies].facet in Cargo.toml, pinned with `=`.
facet = "0.46.5"

[proto]
# Runtime crates the generated Connect/protobuf code compiles against. The matching buf
# PLUGINS (protoc-gen-buffa, protoc-gen-connect-rust, protoc-gen-buffa-packaging) are
# pinned by the `connectrpc` flake input, not here -- but the two move together. Bumping
# the flake without bumping these leaves the stubs compiling against the wrong API, and
# buffa treats a minor bump as breaking. Bump, regenerate, and commit in one change.
#
# `new-feature` names one of buffa's `#[doc(hidden)]` fields, `__buffa_unknown_fields`, in the
# conversions it generates (RT-27). A bump that renames it fails `just check-template`
# with E0560: change `UNKNOWN_FIELDS` in `tools/xtask/src/api/feature.rs`, and the slices a
# product has already generated by hand.
buffa = "0.9.2"
connectrpc = "0.9.1"
# The gRPC server-reflection service, which reads the descriptor pool `protoc-gen-buffa`
# embeds under `reflect_mode=bridge`. Its own key rather than reuse of `connectrpc` above,
# because the companion crates are numbered independently inside the same release line --
# connectrpc is at 0.9.1 and this is at 0.9.0 -- so a single pin would be wrong for one of
# them. It still moves with the set: it compiles against connectrpc's service traits and
# reads buffa's pool, so bump it with the flake and the two crates above.
connectrpc-reflection = "0.9.0"

# The remote buf plugins for the shell languages, and the runtimes their output compiles
# against. These MUST agree, and the failure when they do not is unhelpful: generated Java
# checks its own version against the runtime at class-initialization time, so a plugin
# ahead of the Gradle dependency fails as ExceptionInInitializerError the first time a
# message is constructed — at runtime, in a test or on a device, naming no file.
#
# The two protobuf numbers are the same release counted differently: the buf plugin and
# protoc use 36.2, the Java and Kotlin artifacts use 4.36.2. Bump them together.
protobuf-plugin = "36.2"
protobuf-runtime = "4.36.2"
# buf.build/connectrpc/kotlin, and com.connectrpc:connect-kotlin* in Gradle.
connect-kotlin = "0.7.2"
# buf.build/apple/swift. No runtime pin here: SwiftPM resolves swift-protobuf transitively
# through connect-swift, so there is no second literal to disagree with.
swift-protobuf-plugin = "1.38.1"
# buf.build/connectrpc/swift, and the Connect package in apps/*/platforms/apple/project.yml.
connect-swift = "1.2.3"

[otel]
# Version-locked set: tracing-opentelemetry 0.34 requires opentelemetry ^0.33, and the
# 0.33 SDK/OTLP/API crates require each other. A partial bump fails at compile time with
# trait mismatches that name neither crate — the facet failure mode, again. Verified
# against the crates.io dependency API on 2026-09-25.
opentelemetry = "0.33"
opentelemetry-sdk = "0.33"
opentelemetry-otlp = "0.33"
opentelemetry-semantic-conventions = "0.33"
tracing-opentelemetry = "0.34"
# Container image tag for the OPT-IN Jaeger devenv process (observability.jaeger.enable,
# default false; nix/observability.nix runs it under podman). Jaeger v2: single binary,
# all-in-one by default, in-memory storage, OTLP receivers on — no flags. Jaeger was
# dropped from nixpkgs (verified against the pinned devenv-nixpkgs revision), which is
# why this is a podman process and not a nix one. This is the only [otel] entry with no
# Cargo/Gradle literal to agree with — Nix reads it directly and nothing else does — so
# `cargo xtask check-versions` has no second spelling to assert against it. The collector
# needs no entry: its version is governed by the devenv-nixpkgs revision devenv.lock
# already holds, the same status as postgresql_17.
jaeger = "2.21.0"

[rust]
channel = "nightly"

[android]
# Also the NDK clang wrapper suffix (…-android<api-level>-clang).
api-level = "34"
min-sdk = "34"
compile-sdk = "36"
target-sdk = "36"
# Pinned on BOTH sides, which is the whole point of naming it here: the Nix SDK contains
# exactly the build-tools listed in devenv.nix, and AGP otherwise picks a default of its
# own. When those disagree AGP tries to install the missing one into a read-only store path
# and dies with "Failed to install ... The SDK directory is not writable".
build-tools = "36.0.0"
# The emulator image `android-emulator` boots, and the only one the Nix SDK realises.
# Two types across four ABIs is the composition's default -- eight images, several GB
# each -- so both are narrowed to one: x86_64 is the only ABI that gets KVM on a normal
# x86 host, and playstore is the variant carrying Play Services. The API level is NOT
# repeated here; the image follows compile-sdk above.
#
# Unlike every other pin in this file these have no `check-versions` assertion, because
# only Nix reads them -- there is no second tool to disagree with. They live here anyway
# because "which Android image do we run" is a question a reader comes to this file with,
# and a literal buried in nix/android.nix answers it nowhere.
system-image-type = "google_apis_playstore"
system-image-abi = "x86_64"
# The Gradle the wrapper downloads. Pinned here because the wrapper properties are copied
# into every new platform project, and a skeleton that lags the apps it seeds is a build
# that resolves a different Gradle from the one CI proved.
gradle = "8.13"

[publish]
# Where a product pushes its service images. The template's CI never pushes its own (decision
# 5): it validates the archive, and the push step runs on master only and skips with a notice
# when the registry credentials are unset. `cli new` sets `project` to the product's own name,
# so a product never publishes into the template's project by accident.
#
# `registry` is read by `just publish::push`; the image tag is the git revision being built,
# because that is the one thing every deployment, log line and rollback can name.
registry = "harbor.noosphere.uk"
project = "auspex"
