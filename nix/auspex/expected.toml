flake = "/home/me/clan/fleet"

[ssh]
control_persist = 600

[timeouts]
ssh_connect = 5
ssh_approval = 60
probe = 10
eval = 300
settle = 120
diff = 120

[diff]
enabled = false

[eval]
workers = 4
max_memory_mb = 4096

[prometheus]
url = "http://prometheus.example:9090"
stale_after = 60

[cache]
url = "https://ncps.example"

[machines.terra]
target = "root@192.168.1.10"
prometheus_instance = "terra:9100"
public = true
frozen = true

[rolling.taghmata]
kubernetes = true
drain = true
drain_timeout = 900
etcd = true

[rolling.skitarii]
kubernetes = false
drain = false

[update]
parallel = 3
ready_timeout = 300
poll_interval = 10

[kubernetes]
kubeconfig = "/home/me/.kube/fleet"

[keymap]
quit = ["q", "esc"]
down = "j"

[theme]
file = "~/.config/auspex/theme.toml"

[forge]
url = "https://forge.example.org"
repo = "owner/fleet"
token_file = "/home/me/.config/auspex/forge-token"
