flake = "/home/me/clan/fleet"

[timeouts]
ssh_connect = 5
probe = 10
eval = 300
settle = 120

[eval]
workers = 4
max_memory_mb = 4096

[prometheus]
url = "http://prometheus.example:9090"
stale_after = 60

[cache]
url = "https://ncps.example"

[machines.terra]
target = "root@192.168.1.10"
prometheus_instance = "terra:9100"

[keymap]
quit = ["q", "esc"]
down = "j"

[theme]
file = "~/.config/auspex/theme.toml"
