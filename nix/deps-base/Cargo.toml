[workspace]
resolver = "3"

# Membership is glob-driven: creating a directory in the right place is the only
# registration step. The globs are deliberately narrow, because a glob that matches a
# directory without a Cargo.toml is a hard error ("failed to load manifest for workspace
# member"), and `exclude` does NOT accept globs to undo it — only concrete paths.
#
# Hence the rule that shapes the whole tree:
#
#   apps/<app>/core         the Crux core, or an app's single library crate
#   apps/<app>/client       shell-side code the app's shells share (optional)
#   apps/<app>/shells/*     Rust shells ONLY (tui, leptos/wasm, gpui, ...)
#   apps/<app>/platforms/*  Gradle / Xcode projects — built by their own toolchain,
#                           never a Cargo member, never matched by a glob here
#   crates/*                reusable libraries
#   services/*              long-running binaries
#   tools/*                 repo tooling (xtask)
members = [
    "crates/*",
    "services/*",
    "tools/*",
]

# A bare `cargo build` / `cargo test` at the root skips the heavy shells: gpui pulls in a
# whole renderer and the web shell only builds for wasm32. Those are reached explicitly
# with `-p`, or through `just apps/<app>/dev`. Globs are supported here too.
default-members = [
    "crates/*",
    "services/*",
    "tools/*",
]

# Skeletons for `cargo xtask new`. They contain Cargo.toml files that are deliberately not
# members — and without this, running cargo from inside one fails with "current package
# believes it's in a workspace when it's not".
exclude = ["templates"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
authors = ["apetrovic <petrovicante6@gmail.com>"]
repository = "https://forge.noosphere.uk/manjo/auspex"
license = "MIT OR Apache-2.0"
description = "A fleet scanner TUI for Clan: reachability, drift, deploy previews and deploys."

[workspace.dependencies]
# Third-party only. Internal crates use relative path dependencies so that adding an app
# never requires editing this file.
anyhow = "1.0.104"
boltffi = "=0.30.1"
# Generated-code runtimes. These MUST agree with the buf plugin versions pinned by the
# `connectrpc` flake input: the plugins emit code against a specific buffa/connectrpc API,
# and buffa treats a minor bump as breaking. See versions.toml.
buffa = { version = "0.9.2", features = ["json"] }
# The descriptor pool the generated code embeds under `reflect_mode=bridge`, which is what
# server reflection reads. Versioned with buffa and checked against the same pin: the
# generated code references this crate by name, so a split between them is a compile error
# in generated output nobody edits.
buffa-descriptor = { version = "0.9.2", features = ["reflect"] }
# The wasm-safe minimum, because `proto` inherits this and the Leptos shell compiles it
# for wasm32. `services/api` opts back into the axum and hyper pieces; nothing else in the
# workspace needs them, and pulling them in here would break the wasm build.
connectrpc = { version = "0.9.1", default-features = false, features = ["json"] }
# Server reflection, for the schema-discovery half of the contract. Pinned in
# versions.toml beside connectrpc and buffa, and numbered independently of them.
connectrpc-reflection = "0.9.0"
clap = { version = "4.6.6", features = ["derive"] }
crux_core = "0.20"
facet = "=0.46.5"
# Held below 0.16.3 on purpose. `facet_generate` (through `crux_core/facet_typegen`) takes
# `textwrap` at its default features, and from 0.16.3 those switch line breaking from the
# `unicode-linebreak` crate to `icu_segmenter` WITH `compiled_data` — a whole second copy of
# the ICU segmentation data, which `cargo xtask check` refuses (`icu_segmenter_data` in
# Cargo.lock, ADR 0021). A dependency's default features cannot be turned off from outside,
# so the version is the only handle: this keeps a re-resolved lock (a new product, `cargo
# update`) on 0.16.2. Lift it when textwrap or facet_generate can leave the ICU feature off.
textwrap = ">=0.16, <0.16.3"
# Appears in four manifests — the counter web shell, both web shells in templates/, and
# crates/i18n's optional `leptos`. Leptos context (`expect_context` for the locale signal in
# `i18n::reactive::tr`) is matched by type identity, so what this entry buys is one `leptos`
# in the graph. Which pins actually threaten that was measured, because the obvious story is
# wrong: a compatible local pin (`leptos = "0.8.19"`) unifies to a single version and changes
# nothing, and an exact one (`"=0.8.19"`) is refused outright — "all possible versions
# conflict with previously selected packages" — since crates/i18n requires `^0.8.20` and
# every consumer links it. What cargo does NOT catch is a *major* drift: a shell on 0.9 while
# crates/i18n stays on 0.8 puts both in the graph, compiles, and misses the lookup at runtime
# with what reads as "no locale provided". That is the case this entry exists to prevent, and
# the only one worth the words. It lives here and not in versions.toml — four Cargo manifests
# is a workspace dependency; versions.toml is for numbers two *tools* must agree on (ADR 0005).
leptos = { version = "0.8.20", features = ["csr"] }
gpui-kit = "0.6"
# The TUI's three, here for gpui-kit's reason rather than a new one: each is named by two
# manifests — the example app's shell and the crux-app skeleton's — and a version that
# disagrees between them scaffolds an app pinned to a different ratatui than the example it
# was copied from, which nothing would report. Cargo manifests, so a workspace dependency
# and not versions.toml, which is for numbers two *tools* must agree on (ADR 0005).
ratatui = "0.30.2"
# `event-stream` turns the keyboard into a `Stream`, which is what lets it sit in the same
# `tokio::select!` as the frame timer. Without it the only way to read a key is a blocking
# poll, and the loop is back to choosing between the keyboard and everything else.
crossterm = { version = "0.29.0", features = ["event-stream"] }
# `StreamExt::next` for that stream — the crate ratatui's own async example uses.
tokio-stream = "0.1.19"
axum = "0.8"
bytes = "1"
http = "1"
http-body = "1"
serde = "1.0.229"
serde_json = "1"
sea-orm = { version = "1.1", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "sqlx-postgres",
    "with-chrono",
] }
sea-orm-migration = { version = "1.1", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
# `time` is declared explicitly although services/api compiled without it: a transitive
# dependency happened to enable it, which is not a guarantee — drop that dependency and
# every `tokio::time` call stops compiling for reasons unrelated to the change.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "compression-gzip", "fs"] }
thiserror = "2.0"
tracing = "0.1"
# --- shared HTTPS stack: `crates/oidc`'s verifier and the example app's native login ---
#
# `crates/oidc` (ADR 0027) and the client crate's `login` feature (ADR 0028) both fetch an
# OIDC provider over TLS, and both must do it without touching `reqwest`. Shared here rather than
# duplicated in the two manifests so the two cannot drift apart, and kept in a product (not
# stripped with the oidc-only entries): a product keeps the example app's client crate, so these
# survive `cli new` for it. Each choice has a reason that is not visible from its feature list:
#
# - There is NO `reqwest` here, on purpose. Its TLS features are unified across one cargo build, and
#   `opentelemetry-otlp` builds a blocking `reqwest` client inside `crates/telemetry`: any TLS
#   feature a crate asked of `reqwest` reached that client too. Without a default provider it panics
#   at construction; with one it verifies against the platform trust store, which the `FROM scratch`
#   image does not have, so it fails to build there. HTTPS here is `hyper-util` + `hyper-rustls` over
#   an explicit config, and `reqwest`'s own features are left exactly as they were.
# - `rustls` on `aws-lc-rs`: one crypto provider for the JWT signature and the TLS handshake, and the
#   provider the client code names explicitly (`builder_with_provider`, never `ClientConfig::builder()`,
#   which panics when `sqlx`'s `ring` is compiled in beside it).
# - `webpki-roots` is the explicit root store the image and the shells need (no CA bundle), compiled in.
# - `hyper-rustls` takes no provider feature and no root feature: the config is passed whole.
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
webpki-roots = "1.0.10"
hyper = { version = "1", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
url = "2"
base64 = "0.22"
# The native login stack (the client crate's `login` feature, ADR 0028). `oauth2` on
# `default-features = false` so NO HTTP client arrives with it: the crate ships a reqwest client
# behind its default features, and the login module supplies its own `AsyncHttpClient` on the shared
# stack above for exactly the reason `crates/oidc` refuses reqwest. `keyring` is the OS keyring (a
# 0600-file fallback in the module covers a missing Secret Service); `open` opens the system browser
# for the loopback PKCE flow.
oauth2 = { version = "5", default-features = false }
keyring = "4"
open = "5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Version-locked set — see versions.toml [otel] and `cargo xtask check-versions` for why
# these move together. The `opentelemetry` API crate is wasm-clean; the SDK, the OTLP
# exporter and their transports are not, which is why only `crates/telemetry` (native
# targets only) may depend on the latter.
#
# The exporter uses the BLOCKING reqwest client, not the async one, and the SDK carries no
# `rt-tokio`: `telemetry::init` builds thread-based processors (BatchSpanProcessor,
# PeriodicReader) that block on their own OS threads, and an async reqwest client blocked
# there panics with "no reactor running" — it needs a Tokio context those threads do not
# have. The blocking client owns its runtime thread, so export works from any `main`,
# tokio or not. This is the otlp crate's own default client; the async `reqwest-client`
# would need tokio-based processors and a runtime at init, coupling a foundational crate
# to tokio for no gain. Caught by the end-to-end `devenv up` check (§13 step 9) — the
# in-memory-exporter tests never touch reqwest, so they could not see it.
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "reqwest-blocking-client"] }
# `semconv_experimental` gates the RPC attribute and metric-name constants the server
# layer spells itself with — the stable subset of the crate carries HTTP and resource
# names only, and hand-typed literals beside a semconv dependency is the worst of both.
opentelemetry-semantic-conventions = { version = "0.33", features = ["semconv_experimental"] }
tracing-opentelemetry = "0.34"

[workspace.lints.rust]
unsafe_code = "forbid"

# The generated service traits return `ServiceResult<impl Encodable<M>>`; an impl
# legitimately refines that to the concrete `ServiceResult<M>`. Mirrors connect-rust's own
# workspace lint configuration.
refining_impl_trait = { level = "allow", priority = -1 }

# Every crate opts in with `[lints] workspace = true`. Keeping the lint set here rather
# than on each `cargo clippy` command line means `cargo clippy`, rust-analyzer and CI all
# agree without repeating `-Dclippy::pedantic -Dclippy::nursery` in six Justfiles.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
empty_docs = "allow"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

# gpui renders noticeably slower without optimisations; keep our own code a
# fast debuggable build and optimise just the gpui stack.
[profile.dev.package]
