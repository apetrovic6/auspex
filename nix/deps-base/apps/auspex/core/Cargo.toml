[package]
name = "auspex-core"
version = "0.1.0"
description = "Crux core for the auspex app"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Application code, never published to a registry.
publish = false

# Discovered by the CI pipeline. `wasm` marks the crate as part of the wasm32 closure.
[package.metadata.app]
kind = "core"
wasm = true

[lints]
workspace = true

[lib]
# Explicit, because this name leaks a long way: the cdylib becomes libauspex_core.so /
# auspex_core.wasm, the generated Kotlin calls System.loadLibrary("auspex_core"), and
# the generated C header is auspex_core.h. Two apps in one monorepo must not both ship
# "libshared.so".
name = "auspex_core"
crate-type = ["cdylib", "lib", "staticlib"]

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
facet_typegen = ["crux_core/facet_typegen"]
codegen = [
    "dep:anyhow",
    "dep:clap",
    "dep:log",
    "dep:pretty_env_logger",
    "facet_typegen",
]

[dependencies]
facet = { workspace = true, features = ["chrono"] }
boltffi.workspace = true
crux_core.workspace = true
# Unused here: holds `textwrap` on 0.16.2 (see the workspace manifest).
textwrap.workspace = true
serde = { workspace = true, features = ["derive"] }

# optional dependencies
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
log = { version = "0.4.33", optional = true }
pretty_env_logger = { version = "0.5.0", optional = true }
