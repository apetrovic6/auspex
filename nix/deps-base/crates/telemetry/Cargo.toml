[package]
name = "telemetry"
version = "0.1.0"
description = "Process-wide tracing and panic reporting"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# The tower layer servers mount (§: one span per RPC). Optional so consumers that only
# want logs — the worker template — pull in neither tower nor the body machinery.
server = ["dep:bytes", "dep:http", "dep:http-body", "dep:serde_json", "dep:tower"]

[dependencies]
bytes = { workspace = true, optional = true }
settings = { path = "../settings" }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-semantic-conventions.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tower = { workspace = true, optional = true }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# "testing" unlocks the in-memory exporters the pipeline tests assert against.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
