[package]
name = "api"
version = "0.1.0"
description = "Connect RPC API service"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# Discovered by the CI pipeline and by nix/services.nix (the devenv database comes from the
# `[database]` section of this service's config, read by the same discovery).
#
# `spa` is the fallback single-page application, installed when no web shell is declared.
# The pipeline installs it into the package, the image bakes it at /usr/share/<service>/web,
# and `web.dir` (set by the image or a module) is what makes the service serve it.
#
# `web-shell` names a workspace member with `trunk = true`; a missing or non-Trunk crate
# is an invariant error, not permission to silently serve the demo bundle. Its Trunk `dist/`
# replaces `spa` at package time. `cli new` renames only this value, not unrelated manifest
# text; `--drop-example` removes the key along with its app, retaining the committed fallback
# in `web/bundle`, which needs no front-end toolchain.
[package.metadata.app]
kind = "service"
spa = "web/bundle"

[lints]
workspace = true

[dependencies]
settings = { path = "../../crates/settings" }
identity = { path = "../../crates/identity" }
proto = { path = "../../crates/proto" }
telemetry = { path = "../../crates/telemetry", features = ["server"] }

# Adds back what only the server needs. The workspace default stays wasm-clean so `proto`
# can be compiled for the web shell; `axum` is what supplies ConnectRpcService.
connectrpc = { workspace = true, features = ["axum"] }
connectrpc-reflection.workspace = true
buffa.workspace = true

anyhow.workspace = true
axum.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
# The integration tests drive the real router in-process with `oneshot` instead of over a
# socket: same routing, same middleware, same codecs, no port to race another test for.
http-body-util = "0.1"
serde_json = "1"
# The SPA tests need a bundle on disk, which is a real directory with real files — the same
# thing the image bakes. Already a dependency of `tools/xtask` and of `crates/settings`'
# tests, so this adds no new third-party code to the graph.
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# The observability test drives the real router with an in-memory span exporter and
# asserts on what the RPC layer exports; "testing" unlocks the in-memory exporters.
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# The same test asserts on the RPC layer's attributes by their semconv names rather than by
# hand-typed strings, for the reason `crates/telemetry` spells out: a literal that drifts is
# invisible.
opentelemetry-semantic-conventions.workspace = true
