# “Ažurirano”, not “Zadnje ažurirano”: English gets away with a bare participle because
# English labels often do; Croatian writes the passive feminine of the act itself, which is
# what a Croatian app says for the same row. `%{when}` is filled by the shell with a
# formatted date, never the `i64` the wire carried (ADR 0020).
updated_at = "Ažurirano %{when}"
# Three categories, because Croatian has three: it asks about the last digit, so 21 jabuka
# and 22 jabuke, and an English-shaped two-category copy would print `other` for both.
apples.one = "%{count} jabuka"
apples.few = "%{count} jabuke"
apples.other = "%{count} jabuka"
