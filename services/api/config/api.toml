# Committed defaults. Anything environment-specific belongs in api.<profile>.toml or in an
# APP__ environment variable; anything secret belongs only in the environment.

[application]
host = "127.0.0.1"
port = 5000

[database]
# NO DATABASE LOCATION HERE, deliberately. The base file is what the image bakes and what a
# deployment starts from, and a deployment supplies the location in one of two shapes: the
# structured fields (`host`, `port`, `username`, `database_name`, plus a password from
# `APP__DATABASE__PASSWORD`/`_FILE`) or one `url` (`APP__DATABASE__URL`/`_FILE` — CloudNativePG's
# `<cluster>-app` secret carries the whole thing under `uri`, and a NixOS host whose Postgres
# roles it manages itself can use a peer-auth socket URL such as
# `postgres:///counter?host=/run/postgresql`). The service refuses a configuration that sets
# both shapes, so a location committed here would make every URL deployment impossible.
#
# The local development location lives in `api.local.toml`, which devenv reads and the image
# does not bake. Only the pool size belongs here: it is a property of the process, not of
# which database it reaches.
max_connections = 10

[telemetry]
format = "pretty"
filter = "info,api=debug"

# Reflection answers with every service, method, message and field name in the schema, and
# asks for no credential. A development affordance: off here, on in api.local.toml only.
#
# Stated although the field already defaults to false — a reader should not have to know what
# serde does with an absent section to find out whether the schema is public. docs/adr/0019.
[reflection]
enabled = false
