# Overlay for the `local` profile (the default when APP_PROFILE is unset).
# Committed on purpose: it describes the shared local setup, not one developer's machine.
# Personal overrides go in the environment.

# The local development database. It lives HERE and not in `api.toml` because the base file is
# what the image bakes: a location committed there is a structured field every deployment
# would inherit, and the service refuses a URL alongside one. devenv reads these four fields
# to create the role and database it runs (`nix/pipeline/discovery.nix` merges this overlay
# over the base file), and `devenv up` runs the service with this profile, so the local path
# is unchanged.
#
# No `password` key: it comes from APP__DATABASE__PASSWORD, or from the file
# APP__DATABASE__PASSWORD_FILE names. The field defaults to empty so deserialization does not
# demand a placeholder here.
[database]
host = "127.0.0.1"
port = 5432
username = "counter"
database_name = "counter"

# Names the service for `service.name` in the `local` profile only. Two things are
# deliberate here. There is no `endpoint` key: a committed endpoint is only correct
# while the process beside it runs, so the collector's address arrives as a
# process-scoped `APP__TELEMETRY__OTLP__ENDPOINT` under `devenv up` (see
# nix/observability.nix) — correct by construction, and absent everywhere else including
# CI. And it lives in this overlay rather than the base `api.toml`: config wins over the
# `OTEL_*` env vars, so a name committed for every profile would override an operator's
# `OTEL_SERVICE_NAME` in production. Scoping it to `local` lets a deployment name itself.
[telemetry.otlp]
service_name = "api"

# On in this profile only. Pointing a client at a new endpoint to ask what it offers is the
# first thing anyone does, and under `devenv up` the answer should be the schema rather than a
# 404 that discovery tools report as "server unreachable". A deployment opts in through its
# own overlay or APP__REFLECTION__ENABLED; absent, it is off (api.toml, docs/adr/0019).
[reflection]
enabled = true
