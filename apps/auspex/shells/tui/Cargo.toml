[package]
name = "auspex-tui"
version = "0.1.0"
description = "Terminal shell for the auspex app"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Application code, never published to a registry.
publish = false

# Discovered by the CI pipeline.
[package.metadata.app]
kind = "shell"

[lints]
workspace = true

[dependencies]
auspex-core = { path = "../../core" }
anyhow.workspace = true
tokio.workspace = true
ratatui.workspace = true
# Inherited with `event-stream` on: see the root Cargo.toml for why the loop needs it.
crossterm.workspace = true
tokio-stream.workspace = true
# The count is a number and the sentence around it comes from `crates/i18n` (ADR 0016), so
# a scaffolded app starts with the translations wired rather than adding them after the
# first string. No `leptos`: a terminal shell has no business linking a web framework, and
# this crate is the proof that the translations stand without one. `detect` is the system
# locale reader (ADR 0015) — platform code rather than a framework, and off by default for
# the same reason. `format` is the number formatter (ADR 0017): the count reaches the
# sentence as an `i64`, and `Display` writes no locale's separators.
i18n = { path = "../../../../crates/i18n", features = ["detect", "format"] }
