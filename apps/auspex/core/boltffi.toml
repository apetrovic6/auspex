# Paths are relative to this file's directory (apps/<app>/core), which is also the
# working directory boltffi is invoked from — see `just/crux.just`.
#
# The two output paths point into `../platforms/`, which this archetype does not create: a
# Gradle or Xcode project is not a Cargo crate, and it carries binary assets this templater
# copies but does not substitute. `boltffi pack` creates the `generated/` directories it
# writes to, so nothing breaks meanwhile — but the bindings have no project to compile them
# until you run `just add platform-android auspex` (or `apple`), which derives one
# from an app that has it, or from the skeleton when none does. The app's Justfile needs no
# edit either way: it discovers `platforms/*` at runtime.
[package]
name = "auspex-core"
crate = "auspex-core"
version = "0.1.0"
repository = "https://github.com/apetrovic6/rust-app-template"
license = "MIT OR Apache-2.0"

[targets.apple]
output = "../platforms/apple/generated/Shared"
include_macos = true

[targets.apple.swift]
module_name = "Shared"

[targets.apple.spm]
package_name = "Shared"
layout = "ffi-only"

[targets.android]
output = "../platforms/android/generated"
min_sdk = 34

[targets.android.kotlin]
# Must match the Kotlin name in src/bin/codegen.rs: two generators write into one package,
# and if they disagree Gradle compiles neither half. `cargo xtask check` enforces it — the
# Gradle namespace and applicationId too, once a platform project exists.
package = "com.example.auspex"
output = "../platforms/android/generated/kotlin"

[targets.android.pack]
output = "../platforms/android/generated/jniLibs"
