[package]
name = "auspex-core"
version = "0.1.0"
description = "Crux core for auspex: what to ask the fleet, and what the answers mean"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Application code, never published to a registry.
publish = false

# Discovered by the CI pipeline. No `wasm = true`: auspex has one shell, the terminal, and
# will never have a web one, so a wasm32 pass over this crate would check a target nothing
# builds. The template's skeleton sets it because a scaffolded core might grow a web shell.
[package.metadata.app]
kind = "core"

[lints]
workspace = true

# A plain `lib`, not the template's `cdylib`/`staticlib`: those exist for the Kotlin and Swift
# shells' FFI, and auspex's only shell is Rust, linking this crate directly. So there is also
# no `Facet` derive, no typegen `codegen` binary, no `ffi.rs` and no `boltffi.toml`: the core's
# types are `auspex-domain`'s own, unwrapped, and a type that never crosses an FFI boundary
# needs no second description of itself.
[lib]
name = "auspex_core"

[dependencies]
auspex-domain = { path = "../../../crates/auspex-domain" }
crux_core.workspace = true

[dev-dependencies]
serde_json.workspace = true
