syntax = "proto3";

package counter.v1;

// The counter's current value.
//
// Carried inside each RPC's own response message rather than being returned directly:
// buf's STANDARD lint requires a dedicated <Method>Response per RPC, which also lets one
// method grow a field later without touching the others.
message CounterState {
  int64 count = 1;
  // When the row behind `count` was last written, as the service recorded it.
  //
  // Epoch milliseconds, and the unit is in the name because a bare `int64 updated_at`
  // guarantees somebody reads it as seconds. Not `google.protobuf.Timestamp`: the
  // codegen here is protoc-gen-buffa, and nothing in this repository demonstrates that
  // it handles a well-known type (ADR 0020). It is also not the reader's date — that
  // needs the reader's zone, which only a shell has, so this field is an instant and
  // every shell renders it.
  int64 updated_at_unix_ms = 2;
}

message GetRequest {}

message GetResponse {
  CounterState state = 1;
}

message IncrementRequest {
  // Amount to add. Unset (zero) means one, so a caller that does not care can omit it.
  int64 by = 1;
}

message IncrementResponse {
  CounterState state = 1;
}

message DecrementRequest {
  // Amount to subtract. Unset (zero) means one.
  int64 by = 1;
}

message DecrementResponse {
  CounterState state = 1;
}

message ResetRequest {}

message ResetResponse {
  CounterState state = 1;
}

message WhoamiRequest {}

message WhoamiResponse {
  // The subject the service resolved the caller's credential to.
  string subject = 1;
}

service CounterService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Increment(IncrementRequest) returns (IncrementResponse);
  rpc Decrement(DecrementRequest) returns (DecrementResponse);
  rpc Reset(ResetRequest) returns (ResetResponse);
  // Requires an identity; the four above do not.
  //
  // It exists to demonstrate the seam (crates/identity) and nothing else: it needs an
  // identity and no database, which is what makes the authenticated path assertable in CI.
  // The core never emits it, so no shell maps it and no binding is regenerated for it.
  //
  // A product deletes it the day a real method needs protecting — and `tests/api/auth.rs`
  // fails until that method is classified, which is the point of the test. Deleting it
  // without moving the classification pair AND the authenticated-success test onto the
  // replacement leaves the seam with no positive coverage at all, so all three move in the
  // same commit.
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse);
}
